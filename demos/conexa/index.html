<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revivaz · notebook realista (estilo Conexa)</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',-apple-system,system-ui,sans-serif;background:#e9eef6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .tag{position:fixed;top:14px;left:14px;background:#0B1D3A;color:#fff;font-weight:800;font-size:11px;letter-spacing:.1em;padding:6px 12px;border-radius:20px;z-index:9}

  .laptop{width:min(940px,96vw);opacity:0}

  /* ── TAMPA / DISPLAY ── */
  .lid{position:relative;background:linear-gradient(160deg,#2b2b2e,#0d0d0f);border-radius:20px 20px 6px 6px;padding:12px 12px 12px;box-shadow:0 2px 4px rgba(255,255,255,.15) inset,0 40px 70px -30px rgba(11,29,58,.55)}
  .cam{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#1c2a33;box-shadow:0 0 0 1px #000}
  .cam:after{content:"";position:absolute;top:1.4px;left:1.4px;width:2px;height:2px;border-radius:50%;background:#4a6b5a}
  .viewport{border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #000}
  .screen16{aspect-ratio:16/10;display:flex;flex-direction:column}

  /* ── macOS MENU BAR ── */
  .menubar{height:24px;background:linear-gradient(180deg,#bfe0f5,#a9d2ee);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:12px;color:#0d2033}
  .menubar .l{display:flex;align-items:center;gap:13px}
  .menubar .l b{font-weight:800}
  .menubar .l span{font-weight:600;opacity:.9}
  .menubar .r{display:flex;align-items:center;gap:10px;font-weight:700;font-size:11px}

  /* ── SAFARI TOOLBAR ── */
  .safari{height:38px;background:#f2f3f5;border-bottom:1px solid #e0e2e6;display:flex;align-items:center;gap:10px;padding:0 12px}
  .lights{display:flex;gap:7px}
  .lights i{width:11px;height:11px;border-radius:50%;display:block}
  .rd{background:#ff5f57}.yl{background:#febc2e}.gn{background:#28c840}
  .nav{display:flex;gap:12px;color:#9aa0a8;font-size:15px}
  .url{flex:1;height:24px;background:#e7e9 ec;background:#e8eaed;border-radius:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#3c4148;max-width:360px;margin:0 auto}
  .url i{font-size:11px;color:#7b828b}
  .sfr{display:flex;gap:12px;color:#9aa0a8;font-size:15px}

  /* ── APP TOPBAR REVIVAZ ── */
  .appbar{height:46px;background:#fff;border-bottom:1px solid #eef0f3;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .brand{display:flex;align-items:center;gap:22px}
  .brand .logo{font-weight:900;font-size:18px;color:#1D9E75;letter-spacing:-.02em}
  .brand nav{display:flex;gap:20px;font-size:13px;font-weight:700;color:#5b6470}
  .brand nav a{color:#5b6470;text-decoration:none;position:relative;padding:14px 0}
  .brand nav a.on{color:#0B1D3A}
  .brand nav a.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:#1D9E75;border-radius:3px}
  .acct{display:flex;align-items:center;gap:14px;color:#9aa0a8;font-size:16px}
  .acct .who{display:flex;align-items:center;gap:8px;color:#0B1D3A;font-size:13px;font-weight:700}
  .acct .av{width:26px;height:26px;border-radius:50%;overflow:hidden;background:#d6f4f8}
  .acct .av img{width:100%;height:100%;object-fit:cover}

  /* ── VÍDEO CHAMADA ── */
  .call{flex:1;position:relative;background:#0f1a24;overflow:hidden}
  .call>img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
  .docname{position:absolute;top:12px;left:16px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .pip{position:absolute;top:12px;right:16px;width:22%;max-width:150px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 8px 20px -6px rgba(0,0,0,.5)}
  .pip img{width:100%;height:100%;object-fit:cover}
  .ctrls{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:14px}
  .cbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#0B1D3A;font-size:17px;box-shadow:0 6px 16px -4px rgba(0,0,0,.4)}
  .cbtn.end{background:#e2483f;color:#fff;width:52px;border-radius:22px}
  .livebadge{position:absolute;top:44px;left:16px;display:flex;align-items:center;gap:6px;background:rgba(226,72,63,.92);padding:3px 10px;border-radius:20px}
  .livebadge i{width:7px;height:7px;border-radius:50%;background:#fff}
  .livebadge span{font-size:10px;font-weight:800;color:#fff;letter-spacing:.06em}

  /* ── DOBRADIÇA + BASE ── */
  .hinge{height:12px;background:linear-gradient(180deg,#0a0a0b,#232326 55%,#0a0a0b);border-radius:0 0 3px 3px;margin:0 8px;position:relative;z-index:2}
  .deck{height:86px;background:linear-gradient(180deg,#37373b 0%,#1a1a1c 34%,#0d0d0f 100%);clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);border-radius:0 0 16px 16px;position:relative;box-shadow:0 30px 40px -20px rgba(11,29,58,.5)}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:9px;background:#050506;border-radius:0 0 10px 10px}
  .trackpad{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:34%;height:44px;background:linear-gradient(180deg,#242427,#161618);border-radius:8px;box-shadow:inset 0 1px 2px rgba(255,255,255,.06)}
  .shadow{width:70%;height:26px;margin:14px auto 0;background:radial-gradient(50% 60% at 50% 50%,rgba(11,29,58,.28),transparent 70%);border-radius:50%}
</style>
</head>
<body>
<div class="tag">NOTEBOOK REALISTA · ESTILO CONEXA</div>

<div class="laptop" id="laptop">
  <div class="lid">
    <div class="cam"></div>
    <div class="viewport">
      <div class="screen16">
        <div class="menubar">
          <div class="l"><b> Safari</b><span>Arquivo</span><span>Editar</span><span>Visualizar</span><span>Histórico</span><span>Favoritos</span><span>Janela</span><span>Ajuda</span></div>
          <div class="r"><span>📶</span><span>🔍</span><span>🔋</span><span>Sáb 20 Set 10:23</span></div>
        </div>
        <div class="safari">
          <div class="lights"><i class="rd"></i><i class="yl"></i><i class="gn"></i></div>
          <div class="nav"><span>‹</span><span>›</span></div>
          <div class="url">🔒 paciente.revivaz.app</div>
          <div class="sfr"><span>⤴</span><span>＋</span><span>⧉</span></div>
        </div>
        <div class="appbar">
          <div class="brand">
            <div class="logo">Revivaz</div>
            <nav><a class="on">Início</a><a>Consultas</a><a>Revivaz Plus</a><a>Sua saúde</a></nav>
          </div>
          <div class="acct">
            <span>◔</span><span>♡</span>
            <div class="who"><div class="av"><img src="patient.png" alt=""></div>Karina Moreira ▾</div>
          </div>
        </div>
        <div class="call">
          <img src="doctor-hd.png" alt="Dr. Carlos em consulta por vídeo">
          <div class="docname">Dr. Carlos M.</div>
          <div class="livebadge"><i></i><span>AO VIVO · <b id="timer">24:13</b></span></div>
          <div class="pip"><img src="patient.png" alt="Karina"></div>
          <div class="ctrls">
            <div class="cbtn">🎥</div><div class="cbtn">🎙</div><div class="cbtn end" id="end">📞</div><div class="cbtn">💬</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hinge"></div>
  <div class="deck"><div class="notch"></div><div class="trackpad"></div></div>
  <div class="shadow"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
gsap.to("#laptop",{opacity:1,duration:1,ease:"power2.out"});
gsap.from("#laptop",{y:26,scale:.98,duration:1.1,ease:"power3.out"});
gsap.to(".livebadge i",{opacity:.25,repeat:-1,yoyo:true,duration:.8,ease:"sine.inOut"});
gsap.to("#end",{scale:1.07,repeat:-1,yoyo:true,duration:1.1,ease:"sine.inOut"});
var t=1453;setInterval(function(){t++;var m=String(Math.floor(t/60)).padStart(2,"0"),s=String(t%60).padStart(2,"0");var el=document.getElementById("timer");if(el)el.textContent=m+":"+s;},1000);
</script>
</body>
</html>
