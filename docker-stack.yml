version: "3.8"

# revivaz — VPS Contabo izai · Swarm + Traefik. Migrado do Vercel.
# Node (tsx) serve o build estático (landing + /acolhimento) + a API /api/acolhimento.
# Cutover de DNS feito 22/jun: revivaz.com.br + www apontam pro Contabo (saiu do Vercel).
# (Host de staging revivaz-contabo NÃO usado: NXDOMAIN negativo-cacheado 24h pelo meu 1º registro errado.)
# Chat IA = Gemini (gemini-2.5-flash). Chave via Docker secret `revivaz_gemini_key` (external, *_FILE).
# Criar o secret no Contabo: `printf '%s' "<chave>" | docker secret create revivaz_gemini_key -`
# (sem o secret, o chat degrada gracioso: 500 + rodapé 188/192 sempre visível).

# Login WhatsApp (Fase 2): OTP self-contained no server → sessão via service_role.
# Secrets: printf '%s' "<v>" | docker secret create revivaz_{gemini_key,service_role,evolution_key} -
secrets:
  revivaz_gemini_key: { external: true }
  revivaz_service_role: { external: true }
  revivaz_evolution_key: { external: true }

services:
  web:
    image: revivaz:latest
    environment:
      - PORT=8080
      - GEMINI_API_KEY_FILE=/run/secrets/revivaz_gemini_key
      # Supabase (públicas) + service_role via secret (server-side OTP→sessão)
      - SUPABASE_URL=https://akobilxqkwkcfyqdlzzf.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrb2JpbHhxa3drY2Z5cWRsenpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDIwNDcsImV4cCI6MjA5NzgxODA0N30.tdEEaZj1BPYTKjgLUrAv-_SOfZWyGzg7jPdbN77nAPs
      - SUPABASE_SERVICE_ROLE_KEY_FILE=/run/secrets/revivaz_service_role
      # WhatsApp (Evolution) — instância revivaz
      - EVOLUTION_URL=https://evolution.izai.dev
      - EVOLUTION_INSTANCE=revivaz
      - EVOLUTION_API_KEY_FILE=/run/secrets/revivaz_evolution_key
    secrets: [revivaz_gemini_key, revivaz_service_role, revivaz_evolution_key]
    networks: [traefik-public]
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        limits:       { cpus: "0.30", memory: 256M }
        reservations: { memory: 48M }
      restart_policy: { condition: on-failure, delay: 10s, max_attempts: 5 }
      update_config: { parallelism: 1, delay: 12s, order: start-first }
      labels:
        - traefik.enable=true
        - "traefik.http.routers.revivaz.rule=Host(`revivaz.com.br`) || Host(`www.revivaz.com.br`)"
        - traefik.http.routers.revivaz.entrypoints=websecure
        - traefik.http.routers.revivaz.tls.certresolver=le
        - traefik.http.routers.revivaz.priority=410
        - traefik.http.services.revivaz.loadbalancer.server.port=8080

networks:
  traefik-public: { external: true }
