version: "3.8"

# revivaz — VPS Contabo izai · Swarm + Traefik. Migrado do Vercel.
# Node (tsx) serve o build estático (landing + /acolhimento) + a API /api/acolhimento.
# Cutover de DNS feito 22/jun: revivaz.com.br + www apontam pro Contabo (saiu do Vercel).
# (Host de staging revivaz-contabo NÃO usado: NXDOMAIN negativo-cacheado 24h pelo meu 1º registro errado.)
#
# Chat IA + nota-IA = Claude CLI da ASSINATURA (sem token de LLM), via a MESMA ponte
# do Tecnopano no host (deploy/claude-vps/bridge.mjs em host.docker.internal:8787).
# O app fala com a ponte por HTTP local com um secret. Dois secrets external *_FILE:
#   revivaz_claude_bridge_url    → conteúdo: http://host.docker.internal:8787/ask
#   revivaz_claude_bridge_secret → conteúdo: <mesmo BRIDGE_SECRET da ponte no host>
# Criar:  printf '%s' 'http://host.docker.internal:8787/ask' | docker secret create revivaz_claude_bridge_url -
#         printf '%s' '<BRIDGE_SECRET>' | docker secret create revivaz_claude_bridge_secret -
# (sem os secrets, a IA degrada gracioso: 500 + rodapé 188/192 sempre visível).

# service_role do projeto do Diogo ("Operation", schema revivaz). Abre o projeto
# INTEIRO (outros apps dele também): só aqui, nunca no git. Secret com nome novo
# porque Docker secret não se edita:
#   printf '%s' "<v>" | docker secret create revivaz_service_role_operation -
# E-mail de acesso (link + senha temporária) sai pelo SMTP do contato@revivaz.com.br:
#   printf '%s' "<senha do e-mail>" | docker secret create revivaz_smtp_pass -
secrets:
  revivaz_claude_bridge_url: { external: true }
  revivaz_claude_bridge_secret: { external: true }
  revivaz_service_role_operation: { external: true }
  revivaz_smtp_pass: { external: true }
  # Atendimento virtual: MESMO secret que o stack do Jitsi (prosody) usa p/ validar
  # o JWT das salas. O server assina com ele; o Jitsi valida com ele.
  revivaz_jitsi_jwt_secret: { external: true }

services:
  web:
    image: revivaz:latest
    # host.docker.internal → IP do host, p/ alcançar a ponte Claude (bridge.mjs).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8080
      # IA via ponte Claude CLI (assinatura) — URL + secret via Docker secret *_FILE.
      - CLAUDE_BRIDGE_URL_FILE=/run/secrets/revivaz_claude_bridge_url
      - CLAUDE_BRIDGE_SECRET_FILE=/run/secrets/revivaz_claude_bridge_secret
      # Supabase (públicas) + service_role via secret (server-side OTP→sessão)
      - SUPABASE_URL=https://vsztmvkuojmsftnfkzma.supabase.co
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzenRtdmt1b2ptc2Z0bmZrem1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4MjAyNjQsImV4cCI6MjA5MDM5NjI2NH0.XbFMJUAQhChIzMm_DRXIq5n3_8MsSIPYSkQCN3ARt5M
      - SUPABASE_SERVICE_ROLE_KEY_FILE=/run/secrets/revivaz_service_role_operation
      - SMTP_PASS_FILE=/run/secrets/revivaz_smtp_pass
      # O WhatsApp (Evolution) saiu do produto: nenhuma env nem secret aqui.
      # Atendimento virtual (Jitsi). DOMAIN/APP_ID públicos; o JWT_SECRET via secret.
      - JITSI_DOMAIN=meet.revivaz.com.br
      - JITSI_APP_ID=revivaz
      - JITSI_JWT_SECRET_FILE=/run/secrets/revivaz_jitsi_jwt_secret
    secrets: [revivaz_claude_bridge_url, revivaz_claude_bridge_secret, revivaz_service_role_operation, revivaz_smtp_pass, revivaz_jitsi_jwt_secret]
    # Sonda barata: se o processo travar de pé, o Swarm derruba e sobe de novo.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [traefik-public]
    deploy:
      replicas: 1
      placement: { constraints: [node.role == manager] }
      resources:
        limits:       { cpus: "0.30", memory: 256M }
        reservations: { memory: 48M }
      # `any`, NUNCA `on-failure`: com on-failure, um container que sai com
      # código 0 (reinício do Docker, por ex.) fica em estado Complete e o
      # serviço NÃO volta — foi assim que o Jitsi ficou 7 semanas fora do ar.
      restart_policy: { condition: any, delay: 10s }
      update_config: { parallelism: 1, delay: 12s, order: start-first }
      labels:
        - traefik.enable=true
        - "traefik.http.routers.revivaz.rule=Host(`revivaz.com.br`) || Host(`www.revivaz.com.br`) || Host(`comunicado.revivaz.com.br`)"
        - traefik.http.routers.revivaz.entrypoints=websecure
        - traefik.http.routers.revivaz.tls.certresolver=le
        - traefik.http.routers.revivaz.priority=410
        - traefik.http.services.revivaz.loadbalancer.server.port=8080
        # Compressão (brotli+gzip) no edge — o express.static NÃO comprime, e sem
        # isso o main.js ia cru (~47KB em vez de ~11KB), derrubando a Performance
        # mobile no PageSpeed (o Vercel comprimia; a migração p/ Contabo perdeu isso).
        - traefik.http.middlewares.revivaz-compress.compress=true
        - traefik.http.routers.revivaz.middlewares=revivaz-compress

networks:
  traefik-public: { external: true }
